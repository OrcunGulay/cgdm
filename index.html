<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Çiğdem'in Kasımpatısı</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap"
    rel="stylesheet" />
  <style>
    :root {
      --bg-midnight: #020504;
      --bg-emerald-deep: #061812;
      --bg-emerald-mid: #0b291f;
      --bg-emerald-soft: #103729;
      --gold-champagne: #f6e2ac;
      --gold-foil: #e8bd61;
      --gold-amber: #d9821f;
      --flower-scale: clamp(0.56, min(56vw, 52vh) / 370px, 1.16);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-midnight);
      color: var(--gold-champagne);
      font-family: "Cormorant Garamond", "Playfair Display", Georgia, serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      user-select: none;
    }

    .svg-defs {
      position: fixed;
      width: 0;
      height: 0;
      pointer-events: none;
      opacity: 0;
    }

    /* ============================================================
       ATMOSFER VE SİNEMATİK ARKA PLAN
       ============================================================ */
    .stage {
      position: relative;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      background:
        radial-gradient(circle 140px at 16% 24%, rgba(26, 92, 64, 0.16) 0%, transparent 100%),
        radial-gradient(circle 160px at 82% 20%, rgba(214, 148, 52, 0.1) 0%, transparent 100%),
        radial-gradient(circle 150px at 76% 74%, rgba(22, 82, 58, 0.18) 0%, transparent 100%),
        radial-gradient(circle 125px at 18% 78%, rgba(232, 168, 64, 0.08) 0%, transparent 100%),
        radial-gradient(ellipse 66% 58% at 50% 42%,
          rgba(16, 56, 42, 0.62) 0%,
          rgba(8, 30, 23, 0.72) 38%,
          rgba(4, 13, 10, 0.94) 72%,
          #020504 100%),
        radial-gradient(circle at 22% 18%,
          rgba(18, 55, 40, 0.36) 0%,
          transparent 54%),
        radial-gradient(circle at 80% 78%,
          rgba(22, 42, 26, 0.28) 0%,
          transparent 52%),
        #020504;
    }

    .atmosphere {
      position: absolute;
      inset: -4%;
      pointer-events: none;
      overflow: hidden;
    }

    .vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(ellipse 74% 70% at 50% 45%,
          transparent 45%,
          rgba(1, 4, 3, 0.56) 80%,
          rgba(0, 2, 1, 0.9) 100%);
      z-index: 12;
    }

    /* Işık Huzmeleri (Blur Filtresiz Yumuşak Gradyanlar) */
    .light-rays {
      position: absolute;
      inset: -12%;
      pointer-events: none;
    }

    .ray {
      position: absolute;
      top: -18%;
      height: 140%;
      transform-origin: top center;
      mix-blend-mode: screen;
      animation: ray-pulse 11s ease-in-out infinite alternate;
    }

    .ray-1 {
      left: 20%;
      width: 22vw;
      transform: rotate(-24deg);
      background: linear-gradient(90deg, transparent 0%, rgba(248, 212, 134, 0.06) 50%, transparent 100%),
        linear-gradient(180deg, rgba(248, 212, 134, 0.08) 0%, rgba(218, 152, 56, 0.03) 48%, transparent 88%);
    }

    .ray-2 {
      left: 40%;
      width: 28vw;
      transform: rotate(-18deg);
      animation-delay: -3.5s;
      animation-duration: 13s;
      background: linear-gradient(90deg, transparent 0%, rgba(255, 224, 158, 0.055) 50%, transparent 100%),
        linear-gradient(180deg, rgba(255, 224, 158, 0.07) 0%, rgba(232, 165, 62, 0.025) 52%, transparent 90%);
    }

    .ray-3 {
      left: 60%;
      width: 18vw;
      transform: rotate(-11deg);
      animation-delay: -6.5s;
      animation-duration: 15s;
      background: linear-gradient(90deg, transparent 0%, rgba(175, 220, 185, 0.035) 50%, transparent 100%),
        linear-gradient(180deg, rgba(175, 220, 185, 0.04) 0%, rgba(240, 190, 95, 0.02) 48%, transparent 85%);
    }

    @keyframes ray-pulse {
      0% {
        opacity: 0.45;
      }

      100% {
        opacity: 0.85;
      }
    }

    /* Çiçek Arkasındaki Ortam Işığı (Blur Filtresiz Yumuşak Gradyan) */
    .ambient-glow {
      position: absolute;
      left: 50%;
      top: 43%;
      width: min(76vw, 700px);
      height: min(76vw, 700px);
      transform: translate3d(-50%, -50%, 0);
      pointer-events: none;
      z-index: 1;
    }

    .ambient-glow-core {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 48%,
          rgba(255, 206, 102, 0.3) 0%,
          rgba(235, 138, 32, 0.18) 28%,
          rgba(166, 82, 14, 0.09) 50%,
          rgba(24, 72, 48, 0.04) 68%,
          transparent 80%);
      opacity: 0.28;
      transform: scale(0.58);
    }

    .stage.is-playing .ambient-glow-core {
      animation:
        ambient-bloom 3.9s cubic-bezier(0.22, 0.9, 0.28, 1) forwards,
        ambient-breathe 7.5s ease-in-out 3.9s infinite;
    }

    @keyframes ambient-bloom {
      0% {
        opacity: 0.18;
        transform: scale(0.46);
      }

      55% {
        opacity: 0.72;
        transform: scale(0.92);
      }

      100% {
        opacity: 0.92;
        transform: scale(1.06);
      }
    }

    @keyframes ambient-breathe {

      0%,
      100% {
        opacity: 0.88;
        transform: scale(1.04);
      }

      50% {
        opacity: 1;
        transform: scale(1.1);
      }
    }

    /* Bokeh & Altın Toz Parçacıkları Canvas Katmanı */
    #dust-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 8;
    }

    /* ============================================================
       3D KASIMPATI SAHNESİ (KESİN preserve-3d HİYERARŞİSİ)
       ÖNEMLİ: .parallax-rig -> .flower-sway -> .bloom-stage ->
       .petal-whorl -> .petal-slot -> .petal-arm zincirinde ASLA filter,
       backdrop-filter, clip-path, mask-image veya opacity < 1 kullanılmaz.
       ============================================================ */
    .scene {
      position: absolute;
      inset: 0;
      perspective: 1200px;
      perspective-origin: 50% 43%;
      pointer-events: none;
      z-index: 5;
    }

    .parallax-rig {
      position: absolute;
      left: 50%;
      top: 43%;
      width: 0;
      height: 0;
      transform-style: preserve-3d;
      overflow: visible;
      pointer-events: auto;
      cursor: pointer;
      transform: translate3d(0, 0, 0) scale(var(--flower-scale));
    }

    .flower-sway {
      position: relative;
      width: 0;
      height: 0;
      transform-style: preserve-3d;
      overflow: visible;
    }

    .stage.is-playing .flower-sway {
      animation: idle-sway 9s ease-in-out 2.8s infinite;
    }

    @keyframes idle-sway {

      0%,
      100% {
        transform: translate3d(0, 0, 0) rotateX(0deg) rotateY(0deg) rotateZ(0deg) scale(1);
      }

      25% {
        transform: translate3d(2.5px, -3.5px, 3px) rotateX(2.1deg) rotateY(-2.4deg) rotateZ(1.1deg) scale(1.012);
      }

      55% {
        transform: translate3d(-1.5px, -1.5px, 1px) rotateX(-1.4deg) rotateY(2.2deg) rotateZ(-1deg) scale(1.005);
      }

      80% {
        transform: translate3d(-2.5px, 2.5px, -2px) rotateX(1.2deg) rotateY(1.4deg) rotateZ(-0.6deg) scale(0.996);
      }
    }

    .bloom-stage {
      position: relative;
      width: 0;
      height: 0;
      transform-style: preserve-3d;
      overflow: visible;
      transform: scale(0.56) rotateX(36deg) rotateZ(-14deg);
    }

    .stage.is-playing .bloom-stage {
      animation: bloom-master 3.85s cubic-bezier(0.22, 0.92, 0.28, 1) forwards;
    }

    @keyframes bloom-master {
      0% {
        transform: scale(0.56) rotateX(36deg) rotateZ(-14deg);
      }

      42% {
        transform: scale(0.84) rotateX(24deg) rotateZ(-4deg);
      }

      100% {
        transform: scale(1) rotateX(16deg) rotateZ(0deg);
      }
    }

    .receptacle-base {
      position: absolute;
      left: -36px;
      top: -36px;
      width: 72px;
      height: 72px;
      border-radius: 50%;
      transform: translateZ(-20px);
      background: radial-gradient(circle, #3d1203 0%, #1d0802 62%, #0a1f14 100%);
      box-shadow: 0 0 18px rgba(0, 0, 0, 0.8);
      pointer-events: none;
    }

    /* Zümrüt Yeşili Yapraklar ve Çanak Yapraklar (Foliage & Calyx) */
    .foliage-layer {
      position: absolute;
      left: 0;
      top: 0;
      width: 0;
      height: 0;
      transform-style: preserve-3d;
      overflow: visible;
      transform: translateZ(-36px);
      pointer-events: none;
    }

    .leaf-wrap {
      position: absolute;
      left: 0;
      top: 0;
      width: var(--lw, 220px);
      height: var(--lh, 160px);
      transform-origin: 0% 50%;
      transform-style: preserve-3d;
      overflow: visible;
      transform: rotateZ(var(--l-rot, 0deg)) translate3d(var(--l-tx, 22px), var(--l-ty, -50%), 0);
    }

    .leaf-svg {
      display: block;
      width: 100%;
      height: 100%;
      overflow: visible;
      filter: drop-shadow(0 12px 14px rgba(0, 0, 0, 0.58));
      transform-origin: 0% 50%;
      transform: scale(0.58) rotateX(10deg);
    }

    .stage.is-playing .leaf-svg {
      animation: leaf-unfurl 3.6s cubic-bezier(0.22, 0.9, 0.3, 1) var(--l-del, 0.1s) forwards;
    }

    @keyframes leaf-unfurl {
      0% {
        transform: scale(0.58) rotateX(10deg);
      }

      100% {
        transform: scale(1) rotateX(-4deg);
      }
    }

    .calyx-layer {
      position: absolute;
      left: 0;
      top: 0;
      width: 0;
      height: 0;
      transform-style: preserve-3d;
      overflow: visible;
      transform: translateZ(-24px);
      pointer-events: none;
    }

    .sepal-slot {
      position: absolute;
      left: 0;
      top: 0;
      width: 0;
      height: 0;
      transform-style: preserve-3d;
      overflow: visible;
      transform: rotateZ(var(--sz, 0deg)) translateY(-18px);
    }

    .sepal-arm {
      position: absolute;
      left: -10px;
      bottom: 0;
      width: 20px;
      height: 76px;
      transform-origin: 50% 100%;
      transform-style: preserve-3d;
      overflow: visible;
      transform: rotateX(-76deg) scaleY(0.84);
    }

    .stage.is-playing .sepal-arm {
      animation: sepal-open 3.1s cubic-bezier(0.22, 0.9, 0.3, 1) 0.1s forwards;
    }

    @keyframes sepal-open {
      0% {
        transform: rotateX(-76deg) scaleY(0.84);
      }

      100% {
        transform: rotateX(14deg) scaleY(1);
      }
    }

    .sepal-blade {
      width: 100%;
      height: 100%;
      border-radius: 52% 48% 36% 36% / 84% 84% 16% 16%;
      background:
        linear-gradient(90deg, rgba(164, 210, 128, 0.18) 0%, transparent 25%, transparent 75%, rgba(6, 20, 12, 0.45) 100%),
        linear-gradient(180deg, #4b7438 0%, #244a2a 48%, #0e2618 100%);
      box-shadow:
        inset 0 2px 6px rgba(170, 212, 132, 0.2),
        0 8px 16px rgba(0, 0, 0, 0.6);
    }

    /* ============================================================
       TAÇ YAPRAKLAR (PETALS) - 156 ADET, 8 HALKADA KATMANLI
       ============================================================ */
    .petals-container {
      position: absolute;
      left: 0;
      top: 0;
      width: 0;
      height: 0;
      transform-style: preserve-3d;
      overflow: visible;
    }

    .petal-whorl {
      position: absolute;
      left: 0;
      top: 0;
      width: 0;
      height: 0;
      transform-style: preserve-3d;
      overflow: visible;
    }

    .petal-slot {
      position: absolute;
      left: 0;
      top: 0;
      width: 0;
      height: 0;
      transform-style: preserve-3d;
      overflow: visible;
      transform: translateZ(var(--z, 0px)) rotateZ(var(--az, 0deg)) translateY(calc(-1 * var(--r-base, 18px)));
    }

    .petal-arm {
      position: absolute;
      left: calc(var(--w, 26px) * -0.5);
      bottom: 0;
      width: var(--w, 26px);
      height: var(--h, 150px);
      transform-origin: 50% 100%;
      transform-style: preserve-3d;
      overflow: visible;
      transform:
        rotateX(var(--rx-bud, -94deg)) rotateY(var(--ry-bud, 6deg)) rotateZ(var(--rz-bud, 0deg)) scaleX(var(--sx-bud, 0.86)) scaleY(var(--sy-bud, 0.62));
    }

    .stage.is-playing .petal-arm {
      animation: bloom-petal var(--dur, 2.8s) cubic-bezier(0.22, 0.92, 0.3, 1) var(--del, 0.2s) forwards;
    }

    @keyframes bloom-petal {
      0% {
        transform:
          rotateX(var(--rx-bud, -94deg)) rotateY(var(--ry-bud, 6deg)) rotateZ(var(--rz-bud, 0deg)) scaleX(var(--sx-bud, 0.86)) scaleY(var(--sy-bud, 0.62));
      }

      48% {
        transform:
          rotateX(var(--rx-mid, -52deg)) rotateY(calc(var(--ry-bud, 6deg) * 0.45)) rotateZ(calc(var(--rz-bud, 0deg) * 0.4)) scaleX(0.95) scaleY(0.88);
      }

      100% {
        transform:
          rotateX(var(--rx-open, -20deg)) rotateY(var(--ry-open, 0deg)) rotateZ(var(--rz-open, 0deg)) scaleX(1) scaleY(1);
      }
    }

    /* Tekil Taç Yaprağın Işık Geçirgenliği, Damar Dokusu ve Derinliği (Optimize Katman) */
    .petal-blade {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: var(--br, 48% 52% 48% 48% / 32% 33% 67% 68%);
      transform-origin: 50% 100%;
      backface-visibility: visible;
      background-image:
        /* 1. İnce uç kıvrımında ışık geçirgenliği (Subsurface Scattering) */
        radial-gradient(ellipse 88% 42% at 50% 14%,
          var(--c-sss, rgba(255, 241, 168, 0.56)) 0%,
          rgba(255, 206, 94, 0.16) 54%,
          transparent 84%),
        /* 2. Boylamsal içbükey oluk, parlak kenar ve orta damar hattı */
        linear-gradient(90deg,
          var(--c-rim-l, rgba(255, 242, 185, 0.48)) 0%,
          rgba(255, 198, 92, 0.14) 15%,
          rgba(62, 14, 2, 0.24) 32%,
          rgba(255, 224, 138, 0.2) 48%,
          rgba(255, 240, 178, 0.34) 50%,
          rgba(255, 224, 138, 0.2) 52%,
          rgba(62, 14, 2, 0.24) 68%,
          rgba(255, 194, 86, 0.12) 85%,
          var(--c-rim-r, rgba(255, 232, 158, 0.32)) 100%),
        /* 3. Ana renk geçişi: koyu yanık amber boğaz -> sıcak turuncu -> altın sarısı uç */
        linear-gradient(180deg,
          var(--c-tip, #ffe88f) 0%,
          var(--c-high, #f8bc2c) 24%,
          var(--c-mid, #ea7d14) 58%,
          var(--c-base, #b83c07) 84%,
          var(--c-throat, #3a0d02) 100%);
      box-shadow:
        inset 0 2px 4px var(--c-lip, rgba(255, 249, 206, 0.68)),
        inset 0 -16px 18px -6px rgba(34, 6, 0, 0.84),
        0 4px 10px rgba(10, 3, 0, 0.58);
    }

    /* ============================================================
       MERKEZ POLEN DOKUSU (DISC FLORETS & FIBONACCI SPIRAL)
       ============================================================ */
    .pollen-core {
      position: absolute;
      left: -22px;
      top: -22px;
      width: 44px;
      height: 44px;
      transform-style: preserve-3d;
      overflow: visible;
      transform: translateZ(12px) scale(0.32);
      pointer-events: none;
    }

    .stage.is-playing .pollen-core {
      animation: pollen-bloom 2.5s cubic-bezier(0.22, 0.9, 0.3, 1) 1.25s forwards;
    }

    @keyframes pollen-bloom {
      0% {
        transform: translateZ(12px) scale(0.32);
      }

      100% {
        transform: translateZ(21px) scale(1);
      }
    }

    .pollen-disc {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      transform: translateZ(0px);
      background: radial-gradient(circle at 42% 40%,
          #fbe077 0%,
          #e8a822 32%,
          #9e520a 68%,
          #441a03 100%);
      box-shadow:
        inset 0 3px 8px rgba(255, 246, 192, 0.45),
        inset 0 -8px 14px rgba(42, 11, 1, 0.82),
        0 0 18px 4px rgba(52, 14, 2, 0.72),
        0 4px 12px rgba(0, 0, 0, 0.65);
    }

    .floret {
      position: absolute;
      left: 50%;
      top: 50%;
      width: var(--fs, 5px);
      height: var(--fs, 5px);
      margin-left: calc(var(--fs, 5px) * -0.5);
      margin-top: calc(var(--fs, 5px) * -0.5);
      border-radius: 50%;
      transform: translate3d(var(--fx, 0px), var(--fy, 0px), var(--fz, 4px));
      background: radial-gradient(circle at 34% 32%,
          var(--fc-top, #fff6b8) 0%,
          var(--fc-mid, #f6ba2c) 46%,
          var(--fc-dark, #7a3404) 100%);
      box-shadow: 0 1.5px 3px rgba(32, 8, 1, 0.72);
    }

    /* ============================================================
       ALTIN VARAK / ŞAMPANYA TİPOGRAFİ VE IŞIK HÜZMESİ
       ============================================================ */
    .title-wrap {
      position: absolute;
      left: 50%;
      bottom: clamp(3.6vh, 6.2vh, 8.2vh);
      transform: translate3d(-50%, 0, 0);
      width: max-content;
      max-width: 92vw;
      text-align: center;
      pointer-events: none;
      z-index: 10;
    }

    .title-ornament {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin: 0 auto 12px auto;
      width: clamp(130px, 28vw, 230px);
      opacity: 0;
      transform: translateY(10px) scaleX(0.5);
    }

    .stage.is-playing .title-ornament {
      animation: ornament-reveal 1.2s cubic-bezier(0.22, 0.85, 0.3, 1) 2.55s forwards;
    }

    .ornament-line {
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg,
          transparent 0%,
          rgba(244, 216, 148, 0.65) 100%);
    }

    .ornament-line.right {
      background: linear-gradient(90deg,
          rgba(244, 216, 148, 0.65) 0%,
          transparent 100%);
    }

    .ornament-diamond {
      width: 5px;
      height: 5px;
      transform: rotate(45deg);
      background: #fff3c8;
      box-shadow: 0 0 10px rgba(255, 224, 144, 0.9);
    }

    @keyframes ornament-reveal {
      0% {
        opacity: 0;
        transform: translateY(10px) scaleX(0.4);
      }

      100% {
        opacity: 0.92;
        transform: translateY(0) scaleX(1);
      }
    }

    .title-stage {
      position: relative;
      display: inline-block;
      padding: 6px 18px;
    }

    /* Yumuşak Altın Işık Hüzmesi Geçişi */
    .title-beam {
      position: absolute;
      left: -18%;
      top: -35%;
      width: 52%;
      height: 170%;
      border-radius: 50%;
      pointer-events: none;
      background: radial-gradient(ellipse at center,
          rgba(255, 240, 188, 0.32) 0%,
          rgba(246, 200, 102, 0.12) 48%,
          transparent 76%);
      opacity: 0;
      transform: translateX(-25%) scaleY(0.8);
      mix-blend-mode: screen;
    }

    .stage.is-playing .title-beam {
      animation: beam-sweep 2.1s cubic-bezier(0.32, 0.82, 0.35, 1) 2.65s forwards;
    }

    @keyframes beam-sweep {
      0% {
        opacity: 0;
        transform: translateX(-20%) scaleY(0.82);
      }

      35% {
        opacity: 0.95;
        transform: translateX(60%) scaleY(1.04);
      }

      72% {
        opacity: 0.68;
        transform: translateX(145%) scaleY(1);
      }

      100% {
        opacity: 0;
        transform: translateX(210%) scaleY(0.9);
      }
    }

    .title-text {
      position: relative;
      font-family: "Cormorant Garamond", "Playfair Display", Georgia, serif;
      font-weight: 400;
      font-size: clamp(1.38rem, 3vw, 2.5rem);
      letter-spacing: 0.045em;
      line-height: 1.28;
      color: #f6e2ac;
      text-shadow: 0 2px 16px rgba(242, 194, 92, 0.25);
    }

    .title-line {
      display: block;
    }

    .title-line.accent {
      font-style: italic;
      font-size: 1.06em;
      margin-top: 2px;
    }

    .title-char {
      display: inline-block;
      padding: 0.12em 0.012em;
      margin: -0.12em 0;
      background-image: linear-gradient(118deg,
          #c49442 0%,
          #f5df9e 28%,
          #fff9e4 50%,
          #dca94b 74%,
          #f8e7b5 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
      opacity: 0;
      transform: translate3d(0, 14px, 0) scale(0.96);
    }

    .title-space {
      display: inline-block;
      width: 0.26em;
    }

    .stage.is-playing .title-char {
      animation: char-float-in 0.95s cubic-bezier(0.2, 0.9, 0.28, 1) var(--c-del, 2.75s) forwards;
    }

    @keyframes char-float-in {
      0% {
        opacity: 0;
        transform: translate3d(0, 14px, 0) scale(0.96);
      }

  <script>
    (function () {
      "use strict";

      function createSeededRandom(seed) {
        let s = seed >>> 0;
        return function () {
          s = (s * 1664525 + 1013904223) >>> 0;
          return s / 4294967296;
        };
      }

      const rand = createSeededRandom(20261122);

      function randRange(min, max) {
        return min + (max - min) * rand();
      }

      function clamp(val, min, max) {
        return Math.min(max, Math.max(min, val));
      }

      /* ============================================================
         1. ÇANAK YAPRAKLAR (CALYX SEPALS)
         ============================================================ */
      function buildCalyx() {
        const calyx = document.getElementById("calyx-layer");
        const count = 10;
        const frag = document.createDocumentFragment();
        for (let i = 0; i < count; i++) {
          const slot = document.createElement("div");
          slot.className = "sepal-slot";
          const angle = i * (360 / count) + randRange(-5, 5);
          slot.style.setProperty("--sz", angle.toFixed(2) + "deg");

          const arm = document.createElement("div");
          arm.className = "sepal-arm";
          const blade = document.createElement("div");
          blade.className = "sepal-blade";
          arm.appendChild(blade);
          slot.appendChild(arm);
          frag.appendChild(slot);
        }
        calyx.appendChild(frag);
      }

      /* ============================================================
         2. 112 TAÇ YAPRAK (7 HALKA - OPTİMİZE RENK & IŞIK HESAPLAMASI)
         ============================================================ */
      function buildPetals() {
        const container = document.getElementById("flower-petals");
        const whorls = [
          { count: 20, z: -15, rBase: 20, hMin: 158, hMax: 174, wMin: 30, wMax: 35, rxBud: -92, rxOpenMin: -2, rxOpenMax: 6, del: 0.14, dur: 2.94, syBud: 0.62, toneShift: -0.14 },
          { count: 19, z: -10, rBase: 20, hMin: 144, hMax: 158, wMin: 27, wMax: 32, rxBud: -93, rxOpenMin: -14, rxOpenMax: -8, del: 0.32, dur: 2.86, syBud: 0.61, toneShift: -0.08 },
          { count: 18, z: -5, rBase: 20, hMin: 126, hMax: 140, wMin: 24, wMax: 29, rxBud: -94, rxOpenMin: -24, rxOpenMax: -18, del: 0.5, dur: 2.78, syBud: 0.6, toneShift: -0.02 },
          { count: 17, z: 1, rBase: 20, hMin: 108, hMax: 120, wMin: 22, wMax: 26, rxBud: -96, rxOpenMin: -33, rxOpenMax: -27, del: 0.68, dur: 2.7, syBud: 0.59, toneShift: 0.04 },
          { count: 15, z: 7, rBase: 20.5, hMin: 86, hMax: 98, wMin: 19, wMax: 23, rxBud: -98, rxOpenMin: -42, rxOpenMax: -36, del: 0.88, dur: 2.62, syBud: 0.58, toneShift: 0.1 },
          { count: 13, z: 13, rBase: 21, hMin: 64, hMax: 74, wMin: 16, wMax: 19, rxBud: -100, rxOpenMin: -52, rxOpenMax: -46, del: 1.08, dur: 2.52, syBud: 0.56, toneShift: 0.16 },
          { count: 10, z: 18, rBase: 21.5, hMin: 44, hMax: 52, wMin: 13, wMax: 16, rxBud: -104, rxOpenMin: -62, rxOpenMax: -56, del: 1.26, dur: 2.42, syBud: 0.53, toneShift: 0.22 }
        ];

        const frag = document.createDocumentFragment();

        whorls.forEach((whorl, wIdx) => {
          const whorlEl = document.createElement("div");
          whorlEl.className = "petal-whorl";
          const step = 360 / whorl.count;
          const whorlOffset = wIdx * 137.508;

          for (let i = 0; i < whorl.count; i++) {
            const angle = (whorlOffset + i * step + randRange(-3.1, 3.1)) % 360;
            const normAngle = (angle + 360) % 360;

            /* Sol-üst stüdyo ışığı yönüne göre fotorealistik HSL tonlama */
            const lightFactor = Math.cos(((normAngle - 322) * Math.PI) / 180);
            const lit = lightFactor * 0.5 + 0.5; /* 0..1 */
            const warmLift = clamp(lit * 0.85 + whorl.toneShift + randRange(-0.04, 0.04), 0, 1);

            const tipHue = 42 + warmLift * 6;
            const tipLight = 68 + warmLift * 18;
            const highHue = 35 + warmLift * 7;
            const highLight = 52 + warmLift * 14;
            const midHue = 24 + warmLift * 7;
            const midLight = 42 + warmLift * 11;
            const baseHue = 14 + warmLift * 6;
            const baseLight = 24 + warmLift * 10;
            const throatLight = 8 + warmLift * 5;

            const sssAlpha = (0.34 + warmLift * 0.34).toFixed(2);
            const rimL = (0.28 + warmLift * 0.36).toFixed(2);
            const rimR = (0.18 + warmLift * 0.24).toFixed(2);
            const lipAlpha = (0.45 + warmLift * 0.4).toFixed(2);

            const h = randRange(whorl.hMin, whorl.hMax);
            const w = randRange(whorl.wMin, whorl.wMax);

            /* Z-fighting önlemek için katman içi mikro Z ve açı farkı */
            const zMicro = whorl.z + (i % 2 === 0 ? 0.35 : -0.35) + randRange(-0.25, 0.25);
            const rxBud = whorl.rxBud + randRange(-2.6, 2.6);
            const rxOpen = randRange(whorl.rxOpenMin, whorl.rxOpenMax);
            const rxMid = rxBud * 0.54 + rxOpen * 0.46;

            const ryBud = (i % 2 === 0 ? 1 : -1) * randRange(4.5, 9.5);
            const ryOpen = randRange(-2.8, 2.8);
            const rzBud = randRange(-4.5, 4.5);
            const rzOpen = randRange(-1.8, 1.8);

            const del = whorl.del + (i / whorl.count) * 0.12 + randRange(-0.04, 0.05);
            const dur = whorl.dur + randRange(-0.14, 0.14);

            const tl = Math.round(randRange(46, 54));
            const tr = 100 - tl;
            const bl = 48;
            const brVal = 48;
            const vt = wIdx <= 2
              ? Math.round(randRange(26, 32))
              : wIdx <= 5
                ? Math.round(randRange(33, 39))
                : Math.round(randRange(38, 44));
            const vb = 100 - vt;
            const borderRadius = `${tl}% ${tr}% ${brVal}% ${bl}% / ${vt}% ${vt + 1}% ${vb - 1}% ${vb}%`;

            const slot = document.createElement("div");
            slot.className = "petal-slot";
            slot.style.setProperty("--z", zMicro.toFixed(2) + "px");
            slot.style.setProperty("--az", normAngle.toFixed(2) + "deg");
            slot.style.setProperty("--r-base", (whorl.rBase + randRange(-0.2, 0.8)).toFixed(1) + "px");

            const arm = document.createElement("div");
            arm.className = "petal-arm";
            arm.style.setProperty("--w", w.toFixed(1) + "px");
            arm.style.setProperty("--h", h.toFixed(1) + "px");
            arm.style.setProperty("--rx-bud", rxBud.toFixed(2) + "deg");
            arm.style.setProperty("--rx-mid", rxMid.toFixed(2) + "deg");
            arm.style.setProperty("--rx-open", rxOpen.toFixed(2) + "deg");
            arm.style.setProperty("--ry-bud", ryBud.toFixed(2) + "deg");
            arm.style.setProperty("--ry-open", ryOpen.toFixed(2) + "deg");
            arm.style.setProperty("--rz-bud", rzBud.toFixed(2) + "deg");
            arm.style.setProperty("--rz-open", rzOpen.toFixed(2) + "deg");
            arm.style.setProperty("--sx-bud", randRange(0.8, 0.92).toFixed(2));
            arm.style.setProperty("--sy-bud", (whorl.syBud + randRange(-0.04, 0.04)).toFixed(2));
            arm.style.setProperty("--del", Math.max(0.05, del).toFixed(2) + "s");
            arm.style.setProperty("--dur", dur.toFixed(2) + "s");

            const blade = document.createElement("div");
            blade.className = "petal-blade";
            blade.style.setProperty("--br", borderRadius);
            blade.style.setProperty("--c-tip", `hsl(${tipHue.toFixed(1)}, 97%, ${tipLight.toFixed(1)}%)`);
            blade.style.setProperty("--c-high", `hsl(${highHue.toFixed(1)}, 94%, ${highLight.toFixed(1)}%)`);
            blade.style.setProperty("--c-mid", `hsl(${midHue.toFixed(1)}, 90%, ${midLight.toFixed(1)}%)`);
            blade.style.setProperty("--c-base", `hsl(${baseHue.toFixed(1)}, 88%, ${baseLight.toFixed(1)}%)`);
            blade.style.setProperty("--c-throat", `hsl(11, 86%, ${throatLight.toFixed(1)}%)`);
            blade.style.setProperty("--c-sss", `rgba(255, 244, 180, ${sssAlpha})`);
            blade.style.setProperty("--c-rim-l", `rgba(255, 240, 178, ${rimL})`);
            blade.style.setProperty("--c-rim-r", `rgba(255, 224, 144, ${rimR})`);
            blade.style.setProperty("--c-lip", `rgba(255, 249, 208, ${lipAlpha})`);

            arm.appendChild(blade);
            slot.appendChild(arm);
            whorlEl.appendChild(slot);
          }

          frag.appendChild(whorlEl);
        });

        container.appendChild(frag);
      }

      /* ============================================================
         3. VOGEL FİBONACCİ SARMALI İLE 3D POLEN DOKUSU
         ============================================================ */
      function buildPollenCore() {
        const field = document.getElementById("floret-field");
        const count = 48;
        const goldenAngle = 137.507764 * (Math.PI / 180);
        const maxRadius = 19;
        const frag = document.createDocumentFragment();

        for (let i = 0; i < count; i++) {
          const ratio = (i + 0.5) / count;
          const r = maxRadius * Math.sqrt(ratio);
          const theta = i * goldenAngle;
          const fx = Math.cos(theta) * r;
          const fy = Math.sin(theta) * r;

          /* Kubbe yüksekliği: merkezde daha yüksek, kenarlara doğru kavisli */
          const dome = Math.sqrt(Math.max(0, 1 - ratio)) * 9.5 + 1.5;
          const size = 3.4 + ratio * 2.9 + randRange(-0.2, 0.25);

          const isOuter = ratio > 0.48;
          const floret = document.createElement("span");
          floret.className = "floret";
          floret.style.setProperty("--fx", fx.toFixed(2) + "px");
          floret.style.setProperty("--fy", fy.toFixed(2) + "px");
          floret.style.setProperty("--fz", dome.toFixed(2) + "px");
          floret.style.setProperty("--fs", size.toFixed(2) + "px");

          if (isOuter) {
            floret.style.setProperty("--fc-top", "#fff6ba");
            floret.style.setProperty("--fc-mid", "#f7ba26");
            floret.style.setProperty("--fc-dark", "#8a3c04");
          } else {
            floret.style.setProperty("--fc-top", "#ffe48a");
            floret.style.setProperty("--fc-mid", "#c97b12");
            floret.style.setProperty("--fc-dark", "#4c2102");
          }

          frag.appendChild(floret);
        }

        field.appendChild(frag);
      }

      /* ============================================================
         4. ALTIN VARAK TİPOGRAFİ KARAKTER HAZIRLIĞI
         ============================================================ */
      function buildTitle() {
        const lines = document.querySelectorAll(".title-line");
        let charIndex = 0;

        lines.forEach((lineEl) => {
          const text = lineEl.dataset.text || "";
          const frag = document.createDocumentFragment();
          for (const ch of text) {
            if (ch === " ") {
              const sp = document.createElement("span");
              sp.className = "title-space";
              sp.innerHTML = "&nbsp;";
              frag.appendChild(sp);
              continue;
            }
            const span = document.createElement("span");
            span.className = "title-char";
            span.textContent = ch;
            const delay = 2.72 + charIndex * 0.026;
            span.style.setProperty("--c-del", delay.toFixed(3) + "s");
            frag.appendChild(span);
            charIndex++;
          }
          lineEl.appendChild(frag);
        });
      }

      /* ============================================================
         5. SPRİTE ÖNBELLEKLİ TOZ/BOKEH + HAFİF 3D PARALAKS
         ============================================================ */
      function createGlowSprite(rgb, size) {
        const half = size / 2;
        const c = document.createElement("canvas");
        c.width = size;
        c.height = size;
        const gctx = c.getContext("2d");
        const g = gctx.createRadialGradient(half, half, 0, half, half, half);
        g.addColorStop(0, `rgba(${rgb}, 1)`);
        g.addColorStop(0.32, `rgba(${rgb}, 0.42)`);
        g.addColorStop(1, `rgba(${rgb}, 0)`);
        gctx.fillStyle = g;
        gctx.fillRect(0, 0, size, size);
        return c;
      }

      function initAtmosphereAndParallax() {
        const stage = document.getElementById("stage");
        const canvas = document.getElementById("dust-canvas");
        const ctx = canvas.getContext("2d");
        const lightRays = document.getElementById("light-rays");
        const ambientGlow = document.getElementById("ambient-glow");
        const flowerRig = document.getElementById("flower-rig");
        const titleWrap = document.getElementById("title-wrap");

        let width = window.innerWidth;
        let height = window.innerHeight;

        function resize() {
          width = window.innerWidth;
          height = window.innerHeight;
          canvas.width = width;
          canvas.height = height;
        }
        resize();
        window.addEventListener("resize", resize, { passive: true });

        const dustSprites = [
          createGlowSprite("255, 245, 206", 32),
          createGlowSprite("255, 212, 110", 32)
        ];
        const bokehSprites = [
          createGlowSprite("250, 206, 112", 64),
          createGlowSprite("42, 126, 88", 64)
        ];

        const dust = Array.from({ length: 28 }, (_, i) => ({
          x: Math.random() * width,
          y: Math.random() * height,
          vx: (Math.random() - 0.5) * 0.25,
          vy: -0.22 - Math.random() * 0.34,
          size: i % 3 === 0 ? randRange(10, 16) : randRange(6, 11),
          phase: Math.random() * Math.PI * 2,
          speed: 0.025 + Math.random() * 0.03,
          depth: i % 3 === 0 ? 18 : 10,
          sprite: dustSprites[i % dustSprites.length]
        }));

        const orbs = [
          { rx: 0.24, ry: 0.34, size: 84, op: 0.26, depth: -18, sprite: bokehSprites[0] },
          { rx: 0.74, ry: 0.28, size: 70, op: 0.28, depth: -16, sprite: bokehSprites[0] },
          { rx: 0.85, ry: 0.58, size: 96, op: 0.24, depth: -22, sprite: bokehSprites[1] },
          { rx: 0.13, ry: 0.58, size: 88, op: 0.26, depth: -20, sprite: bokehSprites[1] },
          { rx: 0.38, ry: 0.16, size: 58, op: 0.3, depth: -14, sprite: bokehSprites[0] }
        ];

        let targetX = 0;
        let targetY = 0;
        let currentX = 0;
        let currentY = 0;

        function onPointerMove(clientX, clientY) {
          const w = width || 1;
          const h = height || 1;
          targetX = clamp((clientX / w - 0.5) * 2, -1, 1);
          targetY = clamp((clientY / h - 0.5) * 2, -1, 1);
        }

        window.addEventListener("pointermove", (e) => onPointerMove(e.clientX, e.clientY), { passive: true });
        window.addEventListener(
          "touchmove",
          (e) => {
            if (e.touches && e.touches[0]) onPointerMove(e.touches[0].clientX, e.touches[0].clientY);
          },
          { passive: true }
        );
        document.addEventListener("pointerleave", () => {
          targetX = 0;
          targetY = 0;
        });

        let lastTime = 0;
        function tick(now) {
          requestAnimationFrame(tick);
          if (document.hidden) return;

          const moving = Math.abs(targetX - currentX) > 0.0008 || Math.abs(targetY - currentY) > 0.0008;
          /* Hareket yokken 30 FPS'ye inerek GPU/CPU yükünü yarıya indir */
          if (!moving && now - lastTime < 32) return;
          const dt = lastTime ? Math.min((now - lastTime) / 16.67, 2.5) : 1;
          lastTime = now;

          if (moving) {
            currentX += (targetX - currentX) * 0.08 * dt;
            currentY += (targetY - currentY) * 0.08 * dt;
            lightRays.style.transform = `translate3d(${(currentX * -12).toFixed(1)}px, ${(currentY * -9).toFixed(1)}px, 0)`;
            ambientGlow.style.transform = `translate3d(calc(-50% + ${(currentX * 14).toFixed(1)}px), calc(-50% + ${(currentY * 11).toFixed(1)}px), 0)`;
            flowerRig.style.transform = `translate3d(${(currentX * 11).toFixed(1)}px, ${(currentY * 9).toFixed(1)}px, 0) rotateY(${(currentX * 12).toFixed(2)}deg) rotateX(${(currentY * -10).toFixed(2)}deg) scale(var(--flower-scale))`;
            titleWrap.style.transform = `translate3d(calc(-50% + ${(currentX * 5).toFixed(1)}px), ${(currentY * 3).toFixed(1)}px, 0)`;
          }

          ctx.clearRect(0, 0, width, height);

          for (let i = 0; i < orbs.length; i++) {
            const o = orbs[i];
            ctx.globalAlpha = o.op;
            const ox = o.rx * width + currentX * o.depth - o.size * 0.5;
            const oy = o.ry * height + currentY * o.depth * 0.8 - o.size * 0.5;
            ctx.drawImage(o.sprite, ox, oy, o.size, o.size);
          }

          for (let i = 0; i < dust.length; i++) {
            const d = dust[i];
            d.phase += d.speed * dt;
            d.x += (d.vx + Math.sin(d.phase * 0.7) * 0.14) * dt;
            d.y += d.vy * dt;

            if (d.y < -16) {
              d.y = height + 16;
              d.x = Math.random() * width;
            }
            if (d.x < -16) d.x = width + 16;
            if (d.x > width + 16) d.x = -16;

            ctx.globalAlpha = 0.22 + (Math.sin(d.phase) * 0.5 + 0.5) * 0.68;
            ctx.drawImage(d.sprite, d.x + currentX * d.depth - d.size * 0.5, d.y + currentY * d.depth - d.size * 0.5, d.size, d.size);
          }
          ctx.globalAlpha = 1;
        }
        requestAnimationFrame(tick);

        function playBloom() {
          stage.classList.remove("is-playing");
          void stage.offsetWidth;
          stage.classList.add("is-playing");
        }

        flowerRig.addEventListener("click", playBloom);

        requestAnimationFrame(() => {
          requestAnimationFrame(playBloom);
        });
      }

      buildCalyx();
      buildPetals();
      buildPollenCore();
      buildTitle();
      initAtmosphereAndParallax();
    })();
  </script>
</body>

</html>
